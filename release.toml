# Configuration for cargo-release: https://github.com/crate-ci/cargo-release
#
# `cargo release <patch|minor|major> --execute` bumps the version, turns the
# "## Unreleased" section of CHANGELOG.md into the release's section, commits,
# tags vX.Y.Z and pushes. Publishing to crates.io (via trusted publishing) and
# creating the GitHub Release happen in .github/workflows/release.yml once the
# tag is pushed, so cargo-release itself does not publish.
publish = false
allow-branch = ["main"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/pddl-rs/releases/tag/v{{version}}", exactly = 1 },
]

# Configuration for cargo-release: https://github.com/crate-ci/cargo-release
#
# This file is the workspace defaults and the config of pddl-core, the root
# package. pddl-core and pddl, which re-exports it, are released together with
# the same version:
#
#     cargo release <patch|minor|major> -p pddl-core -p pddl --execute
#
# That bumps both versions, commits each crate's release, and tags vX.Y.Z for
# pddl (see pddl/release.toml), which turns the "## Unreleased" section of
# CHANGELOG.md into the release's section. Publishing to crates.io (via trusted
# publishing) and creating the GitHub Release happen in
# .github/workflows/release.yml once the tag is pushed, so cargo-release itself
# does not publish.
publish = false
allow-branch = ["main"]
# pddl-core gets no tag of its own: the vX.Y.Z tag of pddl releases both.
# Every other crate sets `tag = true` in its own release.toml.
tag = false
pre-release-commit-message = "Release pddl-core {{version}}"
# Each crate commits its own release, with its own message. In one
# workspace-wide commit, {{version}} isn't filled in.
consolidate-commits = false

[package]
name = "pddl-validate"
version = "0.1.0"
description = "Independent PDDL plan validator: classical, numeric and temporal plans with precise diagnostics"
license = "EUPL-1.2 OR MPL-2.0"
documentation = "https://docs.rs/pddl-validate"
categories = ["science", "development-tools", "parser-implementations"]
keywords = ["pddl", "planning", "validation", "val", "ai-planning"]
repository = "https://github.com/sunsided/pddl-rs"
readme = "README.md"
# Reads the pddl crate's test corpus, which is not part of this crate.
exclude = ["tests/corpus.rs", "release.toml"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
edition = "2021"
rust-version = "1.86.0"

[lints]
workspace = true

[dependencies]
pddl = { version = "0.4.0", path = "../pddl", default-features = false }

[dev-dependencies]
# Tests and doctests parse PDDL text. Path-only, so the published manifest
# carries no versioned dev-dependency on pddl.
pddl = { path = "../pddl", features = ["parser"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Configuration for cargo-release: https://github.com/crate-ci/cargo-release
#
# `cargo release <patch|minor|major> -p pddl-runtime --execute` bumps the
# version, turns the "## Unreleased" section of this crate's CHANGELOG.md into
# the release's section, commits, tags pddl-runtime-vX.Y.Z and pushes. The next
# pddl release (.github/workflows/release.yml) publishes the new version to
# crates.io; the tag itself triggers no workflow.
publish = false
allow-branch = ["main"]
tag = true
tag-name = "pddl-runtime-v{{version}}"
pre-release-commit-message = "Release pddl-runtime {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/pddl-rs/releases/tag/pddl-runtime-v{{version}}", exactly = 1 },
]

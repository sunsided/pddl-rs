[package]
name = "pddl"
version = "0.3.1"
description = "A PDDL 3.1 parser, strongly typed"
license = "EUPL-1.2"
documentation = "https://docs.rs/pddl"
categories = ["parser-implementations", "science", "simulation"]
keywords = ["pddl", "planning", "parser"]
repository = "https://github.com/sunsided/pddl-rs"
readme = "README.md"
# Third-party test inputs under their own licences; not part of the published crate.
exclude = ["tests/data/", "tests/example_files.rs", "tests/corpus_snapshots.rs", "benches/"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
edition = "2021"
rust-version = "1.86.0"
# Resolve dependencies to versions that support `rust-version`.
resolver = "3"

# Features

[features]
default = ["parser", "interning"]
## Enables parsing of PDDL types through the `Parser` trait.
parser = []
## Implements `miette::Diagnostic` for `ParseError`.
miette = ["parser", "dep:miette"]
## Enables string interning for `Name` types to reduce memory footprint.
interning = []
## Enables pretty-printing of PDDL types via the `pretty` crate.
pretty = ["dep:pretty"]
## Implements `serde::Serialize` and `serde::Deserialize` for the PDDL types, using a
## JSON-friendly schema that mirrors PDDL (see the `serde` module docs).
serde = ["parser", "dep:serde"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

[dependencies]
miette = { version = "7", optional = true, default-features = false }
pretty = { version = "0.12.1", optional = true }
serde = { version = "1", optional = true }
thiserror = "2.0.18"

[[test]]
name = "briefcase_world"
required-features = ["parser"]

[[test]]
name = "pretty_print"
required-features = ["pretty", "parser"]

[[test]]
name = "pretty_print_round_trip"
required-features = ["pretty", "parser"]

[[test]]
name = "serde"
required-features = ["serde", "parser"]

[[test]]
name = "pddl_file"
required-features = ["parser"]

[[test]]
name = "example_files"
required-features = ["parser"]

[[test]]
name = "deprecated_names"
required-features = ["parser"]

[[test]]
name = "miette"
required-features = ["miette"]

[[example]]
name = "miette"
required-features = ["miette"]

[[test]]
name = "corpus_snapshots"
required-features = ["pretty", "parser"]

[[example]]
name = "pretty_print"
required-features = ["pretty", "parser"]

[dev-dependencies]
assert2 = "0.4.1"
# Renders `ParseError` as a report in the `miette` feature's tests and example.
# Pinned because the tests compare the rendered report byte for byte.
miette = { version = "=7.6.0", default-features = false, features = ["fancy-no-syscall"] }
# Round-trips the corpus through JSON in the `serde` feature's tests.
serde_json = { version = "1", features = ["preserve_order"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "parse"
harness = false
required-features = ["parser"]

[package]
name = "pddl-core"
version = "0.5.0"
description = "The types and the parser behind the pddl crate, a strongly typed PDDL 3.1 parser; depend on pddl instead"
license = "EUPL-1.2 OR MPL-2.0"
documentation = "https://docs.rs/pddl-core"
categories = ["parser-implementations", "artificial-intelligence", "science"]
keywords = ["pddl", "planning", "parser", "ai-planning", "strips"]
repository = "https://github.com/sunsided/pddl-rs"
readme = "README.md"
# Third-party test inputs under their own licences; not part of the published crate.
exclude = ["tests/data/", "tests/example_files.rs", "tests/corpus_snapshots.rs", "tests/sas_plus.rs", "benches/"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
edition = "2021"
rust-version = "1.86.0"
# Resolve dependencies to versions that support `rust-version`.
resolver = "3"

# Features

[features]
default = ["parser", "interning"]
## Enables parsing of PDDL types through the `Parser` trait.
parser = []
## Implements `miette::Diagnostic` for `ParseError`.
miette = ["parser", "dep:miette"]
## Enables string interning for `Name` types to reduce memory footprint.
interning = []
## Enables pretty-printing of PDDL types via the `pretty` crate.
pretty = ["dep:pretty"]
## Implements `serde::Serialize` and `serde::Deserialize` for the PDDL types, using a
## JSON-friendly schema that mirrors PDDL (see the `serde` module docs).
serde = ["parser", "dep:serde"]
## Grounds a domain and problem into a Fast Downward SAS+ task (`sas_plus::fdr::SasFile`),
## see the `sas_plus` module.
sas-plus = ["dep:sas-plus"]
## Loads problems for planning code that `pddl-codegen` generates from a domain
## (the `codegen` module); used by the code that `pddl`'s `codegen` feature generates.
codegen = ["dep:pddl-runtime"]

[workspace]
members = ["pddl", "pddl-lsp", "pddl-macros", "pddl-nova-tests", "pddl-runtime", "pddl-bench", "pddl-codegen", "pddl-validate"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

[lints]
workspace = true

[dependencies]
miette = { version = "7", optional = true, default-features = false }
pretty = { version = "0.12.5", optional = true }
serde = { version = "1", optional = true }
sas-plus = { version = "0.2", optional = true }
pddl-runtime = { version = "0.1.0", path = "pddl-runtime", optional = true }
thiserror = "2.0.21"

[[test]]
name = "briefcase_world"
required-features = ["parser"]

[[test]]
name = "pretty_print"
required-features = ["pretty", "parser"]

[[test]]
name = "pretty_print_round_trip"
required-features = ["pretty", "parser"]

[[test]]
name = "serde"
required-features = ["serde", "parser"]

[[test]]
name = "sas_plus"
required-features = ["sas-plus", "parser"]

[[test]]
name = "pddl_file"
required-features = ["parser"]

[[test]]
name = "example_files"
required-features = ["parser"]

[[test]]
name = "deprecated_names"
required-features = ["parser"]

[[test]]
name = "miette"
required-features = ["miette"]

[[example]]
name = "miette"
required-features = ["miette"]

[[test]]
name = "corpus_snapshots"
required-features = ["pretty", "parser"]

[[example]]
name = "as_json"
required-features = ["serde"]

[[example]]
name = "as_yaml"
required-features = ["serde"]

[[example]]
name = "as_toml"
required-features = ["serde"]

[[example]]
name = "pretty_print"
required-features = ["pretty", "parser"]

[dev-dependencies]
# Tests, examples and doctests use the `pddl::` paths users see. No default
# features, so `cargo test --no-default-features` still tests this crate without them.
pddl = { path = "pddl", default-features = false }
assert2 = "0.4.1"
# Renders `ParseError` as a report in the `miette` feature's tests and example.
# Pinned because the tests compare the rendered report byte for byte.
miette = { version = "=7.6.0", default-features = false, features = ["fancy-no-syscall"] }
# The `serde` feature's tests and examples; `preserve_order` keeps parameters in order.
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "parse"
harness = false
required-features = ["parser"]

---
name: Publish VS Code extension

# Publishes editors/vscode to the VS Code Marketplace as sunsided.pddl-lsp, with
# Trusted Publishing: the Marketplace accepts this workflow's OIDC token, so no
# access token is stored. Run it from the Actions tab or with `task vscode:publish`.
# Afterwards it tags the commit vscode-vX.Y.Z and creates a GitHub Release with
# the .vsix attached.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish
    # Only reviewed code: the Actions tab also offers other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Create the tag and the GitHub Release.
      contents: write
      # Trusted Publishing, and signing the build provenance attestation.
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1-threads --no-self-update
          rustup default stable
      - name: Build the server as WebAssembly
        run: |
          cargo build --release -p pddl-lsp --target wasm32-wasip1-threads
          mkdir -p server
          cp ../../target/wasm32-wasip1-threads/release/pddl-lsp.wasm server/
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Package
        run: |
          version=$(node -p 'require("./package.json").version')
          # The release notes: the section from "## X.Y.Z - date" up to the next
          # "## " heading. Checked here, before anything is published.
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## $version - <date>' section with entries"
            exit 1
          fi
          vsix="pddl-lsp-$version.vsix"
          yarn run package --out "$vsix"
          sha256sum "$vsix" > "$vsix.sha256"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"
      # Package once and publish that file, so the attestation covers what is uploaded.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: editors/vscode/${{ env.VSIX }}
      - name: Publish
        run: yarn vsce publish --packagePath "$VSIX" --oidc
      # Runs only after the Marketplace accepted the version, so the release holds
      # the same file. Publishing a version twice fails above, so a re-run can't
      # attach a rebuilt .vsix.
      - name: Create the GitHub Release
        run: |
          # Not "latest": that stays with the pddl crate's releases.
          gh release create "vscode-v$VERSION" "$VSIX" "$VSIX.sha256" --target "$GITHUB_SHA" \
            --title "VS Code extension $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest=false
        env:
          GH_TOKEN: ${{ github.token }}

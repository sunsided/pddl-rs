---
name: Publish VS Code extension

# Publishes editors/vscode to the VS Code Marketplace as sunsided.pddl-lsp, with
# Trusted Publishing: the Marketplace accepts this workflow's OIDC token, so no
# access token is stored. Run it from the Actions tab or with `task vscode:publish`.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing, and signing the build provenance attestation.
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1-threads --no-self-update
          rustup default stable
      - name: Build the server as WebAssembly
        run: |
          cargo build --release -p pddl-lsp --target wasm32-wasip1-threads
          mkdir -p server
          cp ../../target/wasm32-wasip1-threads/release/pddl-lsp.wasm server/
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Package
        run: yarn run package --out pddl-lsp.vsix
      # Package once and publish that file, so the attestation covers what is uploaded.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: editors/vscode/pddl-lsp.vsix
      - name: Publish
        run: yarn vsce publish --packagePath pddl-lsp.vsix --oidc

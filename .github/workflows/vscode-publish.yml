---
name: Publish VS Code extension

# Publishes editors/vscode to the VS Code Marketplace as sunsided.pddl-lsp, with
# Trusted Publishing: the Marketplace accepts this workflow's OIDC token, so no
# access token is stored. Run it from the Actions tab or with `task vscode:publish`.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1-threads --no-self-update
          rustup default stable
      - name: Build the server as WebAssembly
        run: |
          cargo build --release -p pddl-lsp --target wasm32-wasip1-threads
          mkdir -p server
          cp ../../target/wasm32-wasip1-threads/release/pddl-lsp.wasm server/
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Publish
        run: yarn run publish:marketplace --oidc

---
name: Lint workflows

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/**'

permissions: {}

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor@1.32.0
      # install-action has no actionlint package; Dependabot doesn't bump this version.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint
      - name: Run zizmor
        run: zizmor --format=github .github/workflows/
        env:
          # Enables zizmor's online audits (e.g. known-vulnerable actions, impostor commits).
          GH_TOKEN: ${{ github.token }}

  # Reporting only: SARIF output never fails on findings; the blocking `lint` job above gates merges.
  zizmor-sarif:
    name: zizmor (code scanning)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor@1.32.0
      - name: Run zizmor
        run: zizmor --format=sarif .github/workflows/ > zizmor.sarif
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

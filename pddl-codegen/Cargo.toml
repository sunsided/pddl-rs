[package]
name = "pddl-codegen"
version = "0.1.0"
description = "Generates typed Rust planning code from PDDL domains and problems, for pddl's #[task] attribute and build scripts"
license = "EUPL-1.2 OR MPL-2.0"
categories = ["development-tools::build-utils", "artificial-intelligence", "science"]
keywords = ["pddl", "planning", "codegen", "code-generation", "ai-planning"]
repository = "https://github.com/sunsided/pddl-rs"
homepage = "https://sunsided.github.io/planning-and-search/"
readme = "README.md"
exclude = ["release.toml"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
edition = "2021"
rust-version = "1.86.0"

[lints]
workspace = true

[dependencies]
pddl-core = { version = "0.5.0", path = "..", default-features = false, features = ["parser", "sas-plus"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"

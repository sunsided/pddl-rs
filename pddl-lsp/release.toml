# Configuration for cargo-release: https://github.com/crate-ci/cargo-release
#
# `cargo release <patch|minor|major> -p pddl-lsp --execute` bumps the version,
# turns the "## Unreleased" section of this crate's CHANGELOG.md into the
# release's section, commits, tags pddl-lsp-vX.Y.Z and pushes. Publishing to
# crates.io and the GitHub Release with binaries happen in
# .github/workflows/release-pddl-lsp.yml once the tag is pushed.
publish = false
allow-branch = ["main"]
tag-name = "pddl-lsp-v{{version}}"
pre-release-commit-message = "Release pddl-lsp {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/pddl-rs/releases/tag/pddl-lsp-v{{version}}", exactly = 1 },
]

[package]
name = "pddl-lsp"
version = "0.3.0"
description = "A language server for PDDL: diagnostics, navigation, completion and formatting"
license = "EUPL-1.2 OR MPL-2.0"
categories = ["development-tools", "text-editors", "artificial-intelligence", "science"]
keywords = ["pddl", "planning", "lsp", "language-server", "ai-planning"]
repository = "https://github.com/sunsided/pddl-rs"
homepage = "https://sunsided.github.io/planning-and-search/"
readme = "README.md"
# Reads the pddl crate's test corpus, which is not part of this crate.
exclude = ["tests/corpus.rs", "release.toml"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
edition = "2021"
rust-version = "1.86.0"

[lints]
workspace = true

[dependencies]
pddl = { version = "0.5.0", path = "../pddl", default-features = false, features = ["parser"] }
# Answers `pddl/validatePlan`.
pddl-validate = { version = "0.1.0", path = "../pddl-validate" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = "1"
serde_json = "1"
url = "2"

[dev-dependencies]
assert2 = "0.4.1"
